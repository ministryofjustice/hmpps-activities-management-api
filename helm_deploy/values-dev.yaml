---
# Per environment values which override defaults in hmpps-activities-management-api/values.yaml

generic-service:
  replicaCount: 2

  ingress:
    host: activities-api-dev.prison.service.justice.gov.uk
    modsecurity_enabled: true
    modsecurity_snippet: |
      SecAuditEngine On
      SecRuleEngine DetectionOnly
      SecDefaultAction "phase:2,pass,log,tag:github_team=activities-and-appointments,tag:namespace={{ .Release.Namespace }}"

  env:
    LOCATION_REMAP_ALLOWED_FILE: ""
    HMPPS_AUTH_URL: https://sign-in-dev.hmpps.service.justice.gov.uk/auth
    PRISON_API_URL: https://prison-api-dev.prison.service.justice.gov.uk
    PRISONER_SEARCH_API_URL: https://prisoner-search-dev.prison.service.justice.gov.uk
    CASE_NOTES_API_URL: https://dev.offender-case-notes.service.justice.gov.uk
    NON_ASSOCIATIONS_API_URL: https://non-associations-api-dev.hmpps.service.justice.gov.uk
    INCENTIVES_API_URL: https://incentives-api-dev.hmpps.service.justice.gov.uk
    MANAGE_ADJUDICATIONS_API_URL: https://manage-adjudications-api-dev.hmpps.service.justice.gov.uk
    LOCATIONS_INSIDE_PRISON_API_URL: https://locations-inside-prison-api-dev.hmpps.service.justice.gov.uk
    NOMIS_MAPPING_API_URL: https://nomis-sync-prisoner-mapping-dev.hmpps.service.justice.gov.uk
    EXTERNAL_MOVEMENTS_API_URL: https://external-movements-api-dev.hmpps.service.justice.gov.uk
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: applicationinsights.dev.json
    SPRING_PROFILES_ACTIVE: dev
    SCHEDULE_AHEAD_DAYS: 14
    SCHEDULE_AHEAD_DAYS_ONLINE: 14
    FEATURE_EVENTS_SNS_ENABLED: true
    FEATURE_AUDIT_SERVICE_HMPPS_ENABLED: true
    SENTRY_ENVIRONMENT: development
    ACTIVITIES_LIVE: RSI,LPI,WDI,FMI,FKI,IWI,WMI,GTI,LTI,BCI,FNI,MTI,LEI,RCI,FSI,DMI,WII,HII,RNI,MDI,LFI,LHI,PVI,EYI,PDI,SLI,SNI,HOI,BXI,WEI,WSI,VEI,BLI,PNI,CFI,DWI,LCI,ISI,HEI,MHI,AYI,BRI,BSI,BAI,BNI,NMI,WLI,WHI,WTI,CLI,MRI,ONI,SHI,LII,SWI,GHI,SFI,SKI,WCI,EXI,HCI,EEI,MSI,EWI,HLI,BFI,LLI,HMI,GMI,HBI,DTI,WWI,BWI,HHI,LWI,CWI,SDI,NWI,DHI,FHI,CKI,WRI,NHI,STI,CDI,BMI,HPI,NSI,FYI,WNI,WYI,SPI,GNI,LNI,EHI,FDI,HVI,ESI,AGI,SUI,HDI,UPI,UKI,LYI,KVI,TCI,KMI,MKI
    APPOINTMENTS_LIVE: RSI,LPI,WDI,FMI,FKI,IWI,WMI,GTI,LTI,BCI,FNI,MTI,LEI,RCI,FSI,DMI,WII,HII,RNI,MDI,LFI,LHI,PVI,EYI,PDI,SLI,SNI,HOI,BXI,WEI,WSI,VEI,BLI,PNI,CFI,DWI,LCI,ISI,HEI,MHI,AYI,BRI,BSI,BAI,BNI,NMI,WLI,WHI,WTI,CLI,MRI,ONI,SHI,LII,SWI,GHI,SFI,SKI,WCI,EXI,HCI,EEI,MSI,EWI,HLI,BFI,LLI,HMI,GMI,HBI,DTI,WWI,BWI,HHI,LWI,CWI,SDI,NWI,DHI,FHI,CKI,WRI,NHI,STI,CDI,BMI,HPI,NSI,FYI,FBI,WNI,WYI,SPI,GNI,LNI,EHI,FDI,HVI,ESI,AGI,SUI,HDI,UPI,UKI,LYI,KVI,TCI,KMI,PBI,PFI,TSI,BZI,ACI,ASI,DNI,DGI,FWI,FEI,NLI,OWI,PRI,PYI,RHI,MKI,LGI
    PRISONS_LIVE: RSI,LPI,WDI,FMI,FKI,IWI,WMI,GTI,LTI,BCI,FNI,MTI,LEI,FSI,DMI,HII,WII,RCI,RNI,MDI,LFI,LHI,EYI,PDI,SLI,SNI,BXI,PVI,WEI,WSI,VEI,BLI,HOI,PNI,CFI,DWI,LCI,ISI,HEI,MHI,AYI,BRI,BSI,BAI,BNI,NMI,WLI,WHI,WTI,CLI,MRI,ONI,LII,SWI,GHI,SFI,SKI,SHI,WCI,EXI,HCI,EEI,MSI,HLI,BFI,EWI,LLI,HMI,GMI,HBI,DTI,WWI,HHI,LWI,CWI,SDI,BWI,NWI,FHI,WRI,DHI,NHI,STI,CKI,CDI,BMI,HPI,NSI,FYI,FBI,WNI,WYI,SPI,GNI,PBI,PFI,TSI,BZI,LNI,EHI,FDI,HVI,ESI,AGI,HDI,SUI,UPI,UKI,LYI,KVI,TCI,KMI,ACI,ASI,DNI,DGI,FWI,FEI,NLI,OWI,PRI,PYI,RHI,MKI,LGI
